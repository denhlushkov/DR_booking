# Інтегрована система (ЛР №5): PostgreSQL + API + Nginx (HTTPS, reverse proxy).
#
#   docker compose up -d --build --wait
#
# Застосунок:  https://localhost:8443   (http://localhost:8080 → редирект на HTTPS)
# Сертифікат самопідписаний і генерується автоматично; для production — змонтуйте власний у том tls-certs.

name: dr-booking

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dr_booking
      POSTGRES_USER: dr_booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dr_booking}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Лише для локальних інтеграційних тестів; назовні не публікується.
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr_booking -d dr_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # tini як PID 1: коректна передача сигналів Node-процесу і перезапуск після його аварії.
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_STORE: postgres
      DATABASE_URL: postgres://dr_booking:${POSTGRES_PASSWORD:-dr_booking}@db:5432/dr_booking
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      OFFICE_TIMEZONE: Europe/Kyiv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Nginx: роздає зібраний React SPA, термінує TLS 1.3 і проксує /api/ на server.
  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - tls-certs:/etc/nginx/certs
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  db-data:
  tls-certs:
