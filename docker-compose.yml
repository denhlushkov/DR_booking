# Локальне розгортання всієї системи (TASK-08):
#   docker compose up --build
# Клієнт: http://localhost:8080   API: http://localhost:8080/api/v1 (через Nginx)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dr_booking
      POSTGRES_USER: dr_booking
      POSTGRES_PASSWORD: dr_booking
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr_booking -d dr_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: 3000
      DATA_STORE: postgres
      DATABASE_URL: postgres://dr_booking:dr_booking@db:5432/dr_booking
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy

  # Nginx: роздає зібраний React SPA і проксує /api/ на server (reverse proxy).
  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  db-data:
