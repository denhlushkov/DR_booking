# Локальна конфігурація. У production сюди додається `listen 443 ssl;`
# з `ssl_protocols TLSv1.3;` та сертифікатом (NFR-04).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Reverse proxy на API-сервер (сервіс `server` у docker-compose.yml).
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Довге кешування зібраних файлів з хешем в імені (NFR-02).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: усі інші маршрути віддають index.html.
    location / {
        try_files $uri /index.html;
    }
}
