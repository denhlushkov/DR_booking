name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Типи, модульні тести, PostgreSQL, збірка
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dr_booking
          POSTGRES_PASSWORD: dr_booking
          POSTGRES_DB: dr_booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dr_booking"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Вмикає інтеграційні тести репозиторіїв на справжньому PostgreSQL.
      TEST_DATABASE_URL: postgres://dr_booking:dr_booking@localhost:5432/dr_booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Інтеграція (Docker Compose, Postman, Playwright, навантаження)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Запуск стенду
        run: docker compose up -d --build --wait
      - name: API (Postman / newman)
        run: npm run test:api
      - name: E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Навантаження (NFR-01, FR-04)
        # Еталонні виміри — у docs/integration-report.md; тут — контроль регресій на спільному runner.
        continue-on-error: true
        run: npm run test:load
      - name: Надійність (NFR-03)
        run: npm run test:resilience
      - name: Логи контейнерів
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: |
            e2e/playwright-report
            docs/results
            docs/screenshots
      - name: Зупинка стенду
        if: always()
        run: docker compose down -v
